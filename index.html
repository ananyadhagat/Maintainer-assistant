<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maintainer Copilot</title>
    <meta name="description" content="AI-powered open-source repository assistant for duplicate bug detection, incomplete issue screening, PR summarization, and review draft generation." />
    <meta property="og:title" content="Maintainer Copilot" />
    <meta property="og:description" content="AI-powered open-source repository assistant for duplicate bug detection, incomplete issue screening, PR summarization, and review draft generation." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Gracefully silence Vite dev WebSocket connection errors in sandbox/iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        var msg = (event.reason && (event.reason.message || event.reason.toString())) || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('websocket'))) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event.message || '') + '';
        if (msg.includes('WebSocket') || msg.includes('websocket')) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
